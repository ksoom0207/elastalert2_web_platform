server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }

  # Proxy API to the backend service.
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }
}

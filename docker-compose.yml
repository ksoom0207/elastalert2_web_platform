services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elastalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elastalert}
      POSTGRES_DB: elastalert_web
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elastalert -d elastalert_web"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Dev: allow reaching Keycloak via any hostname/IP (LAN, localhost, etc.).
      # With STRICT=false the token issuer reflects the host the browser used,
      # so the backend's OIDC_ISSUER must use that same host (see KEYCLOAK_URL).
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # realm.json is imported on every start (start-dev --import-realm).
      - ./keycloak:/opt/keycloak/data/import:ro

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://elastalert:${POSTGRES_PASSWORD:-elastalert}@postgres:5432/elastalert_web
      RULES_FOLDER: /data/rules
      # Must equal the token issuer, i.e. the SAME Keycloak URL the browser used.
      # Built from KEYCLOAK_URL so frontend + backend stay in sync.
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-elastalert}
      OIDC_AUDIENCE: ${KEYCLOAK_CLIENT:-elastalert-web}
      ELASTALERT_CONTAINER: elastalert2
      ELASTALERT_CONFIG: /opt/elastalert/config.yaml
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./elastalert/rules:/data/rules
      # Needed so the backend can `docker exec` the test dry-run into elastalert2.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저 + 백엔드 양쪽에서 닿는 Keycloak URL 이어야 합니다 (호스트 LAN IP).
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-elastalert}
        VITE_KEYCLOAK_CLIENT: ${KEYCLOAK_CLIENT:-elastalert-web}
    depends_on:
      - backend
    ports:
      - "8081:80"

  elastalert2:
    image: jertel/elastalert2:2.21.0
    container_name: elastalert2
    depends_on:
      - backend
    environment:
      # So ElastAlert2 can import kst_enhancer (and any future enhancements).
      PYTHONPATH: /opt/elastalert/enhancements
    volumes:
      # Admin-managed base config + shared rules folder (read by ElastAlert2).
      - ./elastalert/config.yaml:/opt/elastalert/config.yaml:ro
      - ./elastalert/rules:/opt/elastalert/rules
      # Custom match enhancements (kst_enhancer.py etc.).
      - ./elastalert/enhancements:/opt/elastalert/enhancements:ro

volumes:
  pgdata:
